<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关系气场测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:#0d0a1a;
  color:#f0e6f6;
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 30% 20%,rgba(180,100,220,.18),transparent),
             radial-gradient(ellipse 60% 70% at 70% 60%,rgba(220,120,160,.15),transparent),
             radial-gradient(ellipse 50% 50% at 50% 80%,rgba(140,80,200,.12),transparent);
}
#app{position:relative;z-index:1;width:100%;max-width:460px;min-height:100vh;padding:20px}

/* 通用隐藏 */
.hidden{display:none!important}

/* 按钮 */
.btn{
  display:block;width:100%;max-width:280px;margin:0 auto;
  padding:14px 40px;border-radius:28px;font-size:16px;font-weight:600;
  border:none;cursor:pointer;color:#fff;text-align:center;
  background:linear-gradient(135deg,#d478c5,#9b6dff);
  box-shadow:0 4px 24px rgba(180,100,220,.35);
  transition:transform .2s;
}
.btn:active{transform:scale(.96)}
.btn.outline{
  background:transparent;border:1.5px solid rgba(200,160,220,.4);
  box-shadow:none;color:#d478c5;
}

/* ===== 开场页 ===== */
#page-start{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:calc(100vh - 40px)}
#page-start .icon{font-size:56px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#page-start h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#d478c5,#9b6dff,#f5a0c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#page-start .sub{color:#a898b8;font-size:14px;margin-bottom:32px;line-height:1.6}
#page-start .tag{display:inline-block;padding:6px 16px;border-radius:20px;font-size:12px;border:1px solid rgba(180,140,200,.35);color:#a898b8;margin-bottom:28px}
.footer-note{margin-top:24px;font-size:11px;color:rgba(180,150,200,.5)}

/* ===== 答题页 ===== */
#page-quiz{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.progress-wrap{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:10px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#d478c5,#9b6dff);border-radius:2px;transition:width .35s ease}
.progress-num{font-size:12px;color:#a898b8;text-align:right;margin-bottom:24px}
.q-card{background:rgba(30,20,50,.85);border-radius:20px;padding:28px 22px;border:1px solid rgba(200,160,220,.12);flex:1;display:flex;flex-direction:column;backdrop-filter:blur(12px)}
.q-title{font-size:17px;font-weight:600;margin-bottom:24px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(200,160,220,.15);background:rgba(40,28,60,.4);cursor:pointer;transition:all .2s;font-size:15px;gap:10px}
.option:active,.option.chosen{border-color:#d478c5;background:rgba(180,120,220,.15)}
.opt-letter{width:28px;height:28px;border-radius:50%;background:rgba(200,160,220,.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}

/* ===== 付费弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(6,4,14,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.paywall-card{background:rgba(30,20,50,.92);border-radius:24px;padding:32px 24px;width:100%;max-width:380px;text-align:center;border:1px solid rgba(200,160,220,.15);backdrop-filter:blur(16px)}
.paywall-card h3{font-size:20px;margin-bottom:6px}
.paywall-card .price{font-size:40px;font-weight:800;color:#f0c060;margin:12px 0 4px}
.paywall-card .price span{font-size:16px}
.blur-preview{margin:20px 0;padding:20px;border-radius:16px;background:rgba(20,12,36,.6);filter:blur(8px);user-select:none;pointer-events:none;font-size:14px;color:#a898b8;line-height:1.7}
.pay-lock{font-size:12px;color:#a898b8;margin:10px 0 4px}
.pay-count{font-size:11px;color:rgba(180,150,200,.35);margin-top:8px}

/* ===== 结果页 ===== */
#page-result{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.result-card{background:rgba(30,20,50,.85);border-radius:24px;padding:32px 22px;border:1px solid rgba(200,160,220,.14);text-align:center;backdrop-filter:blur(12px)}
.result-emoji{font-size:64px;margin-bottom:8px}
.result-name{font-size:26px;font-weight:700;background:linear-gradient(135deg,#d478c5,#9b6dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.result-tagline{font-size:14px;color:#a898b8;margin-bottom:20px}
.stats{display:flex;justify-content:space-around;margin:20px 0}
.stat{text-align:center}
.stat-val{font-size:28px;font-weight:700;color:#d478c5}
.stat-lbl{font-size:11px;color:#a898b8;margin-top:2px}
.r-section{text-align:left;margin-top:20px;padding:16px;border-radius:14px;background:rgba(30,18,48,.5);font-size:14px;line-height:1.8}
.r-section h4{font-size:15px;margin-bottom:8px;color:#9b6dff}

/* spinner */
.spinner{width:32px;height:32px;border:3px solid rgba(200,160,220,.2);border-top-color:#d478c5;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

</div>

// ==================== 结果 ====================
var R = {
  A:{n:"温柔掌控者",e:"👑",tg:"表面温柔似水，内核稳如磐石",

// ==================== 状态 ====================
var cur = 0;
var scores = {};
var resultType = null;
var isPaid = false;

// ==================== DOM ====================
var el = function(id){return document.getElementById(id);};
var pgStart = el('page-start');
var pgQuiz = el('page-quiz');
var pgResult = el('page-result');
var payWall = el('paywall');
var LETTERS = ['A','B','C','D'];

// 初始化分数
for(var k in R){scores[k]=0;}

// ==================== 页面切换 ====================
function go(page){
  pgStart.classList.add('hidden');
  pgQuiz.classList.add('hidden');
  pgResult.classList.add('hidden');
  page.classList.remove('hidden');
}

// ==================== 开始 ====================
function startQuiz(){
  cur = 0;
  for(var k in R){scores[k]=0;}
  resultType = null;
  isPaid = false;
  go(pgQuiz);
  renderQ();
}

// ==================== 渲染题目 ====================
function renderQ(){
  var q = Q[cur];
  el('qtitle').textContent = q.q;
  el('pbar').style.width = (cur / Q.length * 100) + '%';
  el('pnum').textContent = (cur + 1) + ' / ' + Q.length;

  var optEl = el('opts');
  optEl.innerHTML = '';
  for(var i = 0; i < q.o.length; i++){
    (function(opt, idx){
      var d = document.createElement('div');
      d.className = 'option';
      d.innerHTML = '<span class="opt-letter">' + LETTERS[idx] + '</span><span>' + opt.t + '</span>';
      d.onclick = function(){
        for(var t in opt.s){scores[t] += opt.s[t];}
        if(cur < Q.length - 1){
          cur++;
          renderQ();
        } else {
          calcResult();
          showPaywall();
        }
      };
      optEl.appendChild(d);
    })(q.o[i], i);
  }
}

// ==================== 计算结果 ====================
function calcResult(){
  var max = -1;
  for(var k in scores){
    if(scores[k] > max){max = scores[k]; resultType = k;}
  }
  var tied = [];
  for(var k in scores){if(scores[k] === max)tied.push(k);}
  if(tied.length > 1) resultType = tied[Math.floor(Math.random() * tied.length)];
}

// ==================== 付费弹窗 ====================
function showPaywall(){
  var r = R[resultType];
  el('blurprev').innerHTML = '<p>你属于【<b>' + r.n + '</b>】一一 ' + r.tg + '</p><p>' + r.d.substring(0, 40) + '……</p>';
  payWall.classList.remove('hidden');
}

// ==================== 支付 ====================
function handlePay(){
  if(PAY.gateway === 'demo'){
    // 演示模式：直接解锁
    handleSuccess();
  } else {
    // 真实支付
    startPay();
  }
}

function startPay(){
  var btn = el('btn-pay');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>正在生成订单...';

  var orderId = 'quiz_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
  localStorage.setItem('quiz_type', resultType);
  localStorage.setItem('quiz_scores', JSON.stringify(scores));

  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://xorpay.com/api/pay');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function(){
    try {
      var data = JSON.parse(xhr.responseText);
      if(data.status === 'ok'){
        window.location.href = data.pay_url || data.qrcode_url;
      } else {
        alert('支付接口错误：' + (data.msg || '请稍后重试'));
        btn.disabled = false;
        btn.innerHTML = '🔓 支付 ¥0.99 查看结果';
      }
    } catch(e){
      alert('网络错误，请稍后重试');
      btn.disabled = false;
      btn.innerHTML = '🔓 支付 ¥0.99 查看结果';
    }
  };
  xhr.onerror = function(){
    alert('网络错误，请稍后重试');
    btn.disabled = false;
    btn.innerHTML = '🔓 支付 ¥0.99 查看结果';
  };
  xhr.send(JSON.stringify({
    app_id: PAY.appId,
    app_secret: PAY.appSecret,
    amount: PAY.price.toFixed(2),
    order_id: orderId,
    pay_type: 'jsapi',
    name: '关系气场测评结果',
    return_url: window.location.href.split('?')[0] + '?order=' + orderId
  }));
}

// 支付回调恢复
function checkCallback(){
  var m = window.location.search.match(/order=([^&]+)/);
  if(m && !isPaid){
    var t = localStorage.getItem('quiz_type');
    if(t){
      resultType = t;
      var ss = localStorage.getItem('quiz_scores');
      if(ss) scores = JSON.parse(ss);
      localStorage.removeItem('quiz_type');
      localStorage.removeItem('quiz_scores');
      handleSuccess();
    }
    window.history.replaceState({}, '', window.location.pathname);
  }
}

function handleSuccess(){
  isPaid = true;
  payWall.classList.add('hidden');
  showResult();
}

// ==================== 结果展示 ====================
function showResult(){
  var r = R[resultType];
  go(pgResult);

  var html = '';
  html += '<div class="result-emoji">' + r.e + '</div>';
  html += '<div class="result-name">' + r.n + '</div>';
  html += '<div class="result-tagline">"' + r.tg + '"</div>';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-val">' + r.st.a + '</div><div class="stat-lbl">掌控力</div></div>';
  html += '<div class="stat"><div class="stat-val">' + r.st.b + '</div><div class="stat-lbl">吸引力</div></div>';
  html += '<div class="stat"><div class="stat-val">' + r.st.c + '</div><div class="stat-lbl">神秘感</div></div>';
  html += '</div>';
  html += '<div class="r-section"><h4>🔮 气场解析</h4><p>' + r.d + '</p></div>';
  html += '<div class="r-section"><h4>✨ 气场标签</h4><p>' + r.tr + '</p></div>';
  html += '<div class="r-section"><h4>💞 最佳搭档</h4><p>' + r.m + '</p></div>';

  el('rcard').innerHTML = html;
}

// ==================== 分享 ====================
function doShare(){
  var r = R[resultType];
  var text = '🔮 我的关系气场类型是【' + r.n + '】一一' + r.tg + '\n快来看看你是什么类型！';
  if(navigator.share){
    navigator.share({title:'关系气场测评',text:text,url:window.location.href}).catch(function(){});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text + '\n' + window.location.href;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制分享文案到剪贴板，快去发给朋友吧！');
  }
}

// ==================== 绑定事件 ====================
el('btn-start').onclick = startQuiz;
el('btn-pay').onclick = handlePay;
el('btn-retry').onclick = startQuiz;
el('btn-share').onclick = doShare;

// 检查支付回调
checkCallback();
</script>
</body>
</html>
